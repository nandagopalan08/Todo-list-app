<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>todo list</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <br>
    <br>
    <br>
    <div class="container m-4">
      <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
          <div class="card p-4">
            <div class="card-title">todo list</div>
            <div class="card-body">
              <div class="form-group">
                  <input class="form-control" type="text" id="todoinput" placeholder="Enter a new task">
                  <button class="btn btn-success" id="addtodobutton">addTask</button>
              </div>
            </div>
          </div>
          <ul id="todolist" class="list-group">


          </ul>
          <p id="task-counter" class="text-muted">


          </p>
          <div class="btn-group mb-2" role="group">
    <button class="btn btn-outline-secondary" data-filter="all">All</button>
    <button class="btn btn-outline-secondary" data-filter="active">Active</button>
    <button class="btn btn-outline-secondary" data-filter="completed">Completed</button>
</div>


        </div>
        <div class="col-md-3"></div>
       
      </div>
    </div>
    



    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
